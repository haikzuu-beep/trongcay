<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Quản lý Nông Trại</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        h1 { color: #ffca28; }
        
        /* Màn hình khóa Admin */
        #loginBox {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #2a2a2a;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #loginBox input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        /* Ẩn nội dung admin khi chưa đăng nhập */
        #adminContent { display: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #2a2a2a; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background: #333; color: #ffca28; }
        input[type="number"] { width: 90px; padding: 5px; text-align: center; }
        .btn { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-save { background: #28a745; color: white; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-refresh { background: #007bff; color: white; padding: 10px 15px; margin-bottom: 10px; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP ADMIN -->
    <div id="loginBox">
        <h2>🔒 KHU VỰC ADMIN</h2>
        <p style="color: #aaa; font-size: 14px;">Vui lòng nhập mật khẩu Quản trị viên</p>
        <input type="password" id="adminPasswordInput" placeholder="Nhập mật khẩu..." onkeypress="handleAdminLoginKeyPress(event)">
        <br>
        <button class="btn btn-save" style="width: 85%; padding: 10px;" onclick="checkAdminPassword()">Đăng Nhập</button>
    </div>

    <!-- BẢNG QUẢN LÝ (BỊ ẨN MẶC ĐỊNH) -->
    <div id="adminContent">
        <h1>🛠️ BẢNG QUẢN LÝ NGƯỜI CHƠI (ADMIN)</h1>
        <button class="btn btn-refresh" onclick="loadAllPlayers()">🔄 Tải lại danh sách</button>
        <button class="btn btn-delete" style="float: right;" onclick="logoutAdmin()">🚪 Đăng xuất</button>

        <table>
            <thead>
                <tr>
                    <th>UID</th>
                    <th>Tên người chơi</th>
                    <th>Số Xu (Money)</th>
                    <th>Cập nhật lần cuối</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="playerListTable">
                <tr><td colspan="5">Đang tải dữ liệu người chơi...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- SCRIPT TÍCH HỢP TOÀN BỘ LOGIC BẢO MẬT & XỬ LÝ DỮ LIỆU -->
    <script>
        // ==========================================
        // CẤU HÌNH FIREBASE (Thay thế bằng cấu hình của bạn)
        // ==========================================
       const firebaseConfig = {
    apiKey: "AIzaSyAAQDD5JVHWF80LjmxCmeUj-eOPh8U20CQ",
    authDomain: "your-farm-c05ae.firebaseapp.com",
    databaseURL: "https://your-farm-c05ae-default-rtdb.firebaseio.com",
    projectId: "your-farm-c05ae",
    storageBucket: "your-farm-c05ae.firebasestorage.app",
    messagingSenderId: "234932348162",
    appId: "1:234932348162:web:7e20fe4c5a6333bb188e1b",
    measurementId: "G-GNRRP4HS1L"
       };

        // Khởi tạo Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        // ==========================================
        // CÀI ĐẶT BẢO MẬT & MẬT KHẨU ADMIN
        // ==========================================
        const ADMIN_PASSWORD = "biniudau1401chiiudau0611"; // Mật khẩu truy cập của bạn (có thể đổi tại đây)

        // Kiểm tra quyền khi vừa load trang
        document.addEventListener("DOMContentLoaded", () => {
            const isLogged = localStorage.getItem("admin_logged_in");
            if (isLogged === "true") {
                showAdminDashboard();
            }
        });

        // Hàm kiểm tra mật khẩu đăng nhập
        function checkAdminPassword() {
            const inputPass = document.getElementById("adminPasswordInput").value;
            
            if (inputPass === ADMIN_PASSWORD) {
                localStorage.setItem("admin_logged_in", "true");
                showAdminDashboard();
            } else {
                alert("Mật khẩu không chính xác!");
                document.getElementById("adminPasswordInput").value = "";
            }
        }

        // Bắt sự kiện phím Enter ở ô mật khẩu
        function handleAdminLoginKeyPress(event) {
            if (event.key === "Enter") {
                checkAdminPassword();
            }
        }

        // Hiển thị giao diện quản lý và ẩn khung đăng nhập
        function showAdminDashboard() {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
            loadAllPlayers();
        }

        // Đăng xuất khỏi trang admin
        function logoutAdmin() {
            localStorage.removeItem("admin_logged_in");
            location.reload(); // Tải lại trang để hiện khung đăng nhập
        }

        // ==========================================
        // CÁC CHỨC NĂNG QUẢN LÝ NGƯỜI CHƠI
        // ==========================================

        // Tải toàn bộ danh sách người chơi từ Firebase Realtime Database
        function loadAllPlayers() {
            const tableBody = document.getElementById("playerListTable");
            tableBody.innerHTML = `<tr><td colspan="5">Đang tải dữ liệu người chơi...</td></tr>`;

            // Nhánh dữ liệu người chơi trên Firebase (mặc định là "players", bạn có thể đổi nếu cần)
            db.ref("players").once("value")
                .then((snapshot) => {
                    tableBody.innerHTML = "";
                    
                    if (!snapshot.exists()) {
                        tableBody.innerHTML = `<tr><td colspan="5">Không tìm thấy người chơi nào trong cơ sở dữ liệu.</td></tr>`;
                        return;
                    }

                    snapshot.forEach((childSnapshot) => {
                        const uid = childSnapshot.key;
                        const playerData = childSnapshot.val();
                        
                        const playerName = playerData.name || playerData.username || "Không có tên";
                        const playerMoney = playerData.money !== undefined ? playerData.money : 0;
                        const lastUpdated = playerData.lastUpdated || "Không rõ";

                        // Tạo dòng dữ liệu cho bảng
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td><code>${uid}</code></td>
                            <td>${playerName}</td>
                            <td><input type="number" id="money_${uid}" value="${playerMoney}"></td>
                            <td>${lastUpdated}</td>
                            <td>
                                <button class="btn btn-save" onclick="updatePlayerMoney('${uid}')">💾 Lưu</button>
                                <button class="btn btn-delete" onclick="deletePlayer('${uid}')">🗑️ Xóa</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch((error) => {
                    console.error("Lỗi khi tải dữ liệu:", error);
                    tableBody.innerHTML = `<tr><td colspan="5" style="color: #dc3545;">Lỗi tải dữ liệu từ Firebase. Vui lòng kiểm tra lại cấu hình!</td></tr>`;
                });
        }

        // Cập nhật số xu của người chơi cụ thể
        function updatePlayerMoney(uid) {
            const newMoney = parseInt(document.getElementById(`money_${uid}`).value);

            if (isNaN(newMoney)) {
                alert("Vui lòng nhập một số hợp lệ!");
                return;
            }

            const updateData = {
                money: newMoney,
                lastUpdated: new Date().toLocaleString()
            };

            db.ref("players/" + uid).update(updateData)
                .then(() => {
                    alert(`Đã cập nhật thành công số xu cho người chơi (UID: ${uid})!`);
                    loadAllPlayers();
                })
                .catch((error) => {
                    alert("Lỗi khi cập nhật: " + error.message);
                });
        }

        // Xóa người chơi khỏi cơ sở dữ liệu
        function deletePlayer(uid) {
            if (confirm(`Bạn có chắc chắn muốn XÓA người chơi có UID: ${uid} không? Hành động này không thể hoàn tác!`)) {
                db.ref("players/" + uid).remove()
                    .then(() => {
                        alert("Đã xóa người chơi thành công!");
                        loadAllPlayers();
                    })
                    .catch((error) => {
                        alert("Lỗi khi xóa: " + error.message);
                    });
            }
        }
    </script>
</body>
</html>
